<text x="580" y="182" text-anchor="start" font-size="13" fill="#3e4c59">E0：该行尚未出现观测，不能作为key（自身除外）</text>
<text x="580" y="210" text-anchor="start" font-size="13" fill="#3e4c59">E2：本patch全部缺失，但此前已有观测，</text>
<text x="580" y="238" text-anchor="start" font-size="13" fill="#3e4c59">        attend_missing_patches=true时仍可作为key</text>
<text x="580" y="266" text-anchor="start" font-size="13" fill="#3e4c59">编码query：只读不晚于自身的有效patch</text>
<text x="580" y="294" text-anchor="start" font-size="13" fill="#3e4c59">解码query：读全部有效上下文patch，</text>
<text x="580" y="322" text-anchor="start" font-size="13" fill="#3e4c59">        以及不晚于自身的解码槽</text>
<text x="580" y="350" text-anchor="start" font-size="13" fill="#3e4c59">variate轴另用同组、同slot的行间掩码</text>
<text x="460" y="525" text-anchor="middle" font-size="12" fill="#52606d">行为query，列为key；规则对应transformer.cpp中的timeAllowed，加入协变量后还有双流与known行的额外规则</text>
