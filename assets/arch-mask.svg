<text x="580" y="238" text-anchor="start" font-size="13" fill="#3e4c59">        still usable as key when attend_missing_patches=true</text>
<text x="580" y="266" text-anchor="start" font-size="13" fill="#3e4c59">Encoder queries: only read valid patches up to themselves</text>
<text x="580" y="294" text-anchor="start" font-size="13" fill="#3e4c59">Decoder queries: read all valid context patches,</text>
<text x="580" y="322" text-anchor="start" font-size="13" fill="#3e4c59">        plus decoder slots up to themselves</text>
<text x="580" y="350" text-anchor="start" font-size="13" fill="#3e4c59">variate axis uses a cross-row mask within the same group and slot</text>
<text x="460" y="525" text-anchor="middle" font-size="12" fill="#52606d">Rows are queries, columns keys; rules match timeAllowed in transformer.cpp; with covariates added there are extra dual-stream and known-row rules</text>
