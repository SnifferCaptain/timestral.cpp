<text x="355" y="284.4" text-anchor="middle" font-size="14" fill="#222">P written as A panel [keys][6]</text>
<line x1="440" y1="170" x2="478" y2="170" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="480" y="60" width="170" height="44" rx="6" fill="#eeeeee" stroke="#666" stroke-width="1.2"/>
<text x="565" y="78.4" text-anchor="middle" font-size="14" fill="#222">Key block 2 (64 keys)</text>
<text x="565" y="96.4" text-anchor="middle" font-size="14" fill="#222">Empty: skip entire block</text>
<line x1="565" y1="104" x2="565" y2="140" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="480" y="142" width="170" height="70" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1.2"/>
<text x="565" y="173.4" text-anchor="middle" font-size="14" fill="#222">State unchanged</text>
<text x="565" y="191.4" text-anchor="middle" font-size="14" fill="#222">No QK, no PV</text>
<line x1="650" y1="170" x2="688" y2="170" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="690" y="60" width="170" height="44" rx="6" fill="#e8eef7" stroke="#666" stroke-width="1.2"/>
