<text x="775" y="96.4" text-anchor="middle" font-size="14" fill="#222">S = Q·Kᵀ / √d</text>
<line x1="775" y1="104" x2="775" y2="140" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="690" y="142" width="170" height="70" rx="6" fill="#e9f3e6" stroke="#666" stroke-width="1.2"/>
<text x="775" y="164.4" text-anchor="middle" font-size="14" fill="#222">m' = max(m, max S)</text>
<text x="775" y="182.4" text-anchor="middle" font-size="14" fill="#222">α = exp(m − m')</text>
<text x="775" y="200.4" text-anchor="middle" font-size="14" fill="#222">l' = α·l + Σexp(S − m')</text>
<line x1="775" y1="212" x2="775" y2="246" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="690" y="248" width="170" height="44" rx="6" fill="#f4dcb8" stroke="#666" stroke-width="1.2"/>
<text x="775" y="266.4" text-anchor="middle" font-size="14" fill="#222">O' = α·O + P·V</text>
<text x="775" y="284.4" text-anchor="middle" font-size="14" fill="#222">P written as A panel [keys][6]</text>
<text x="470" y="330" text-anchor="middle" font-size="14" fill="#222">After last block O / l is the output; when entire row masked l = 0, output set to 0 without inf - inf</text>
<text x="470" y="354" text-anchor="middle" font-size="13" fill="#555">QK and PV both reuse GEMM microkernel: Q packed as A [d][6], K as [d][16], V as [64 keys][16 dims] for B</text>
<text x="470" y="376" text-anchor="middle" font-size="13" fill="#555">Workspace is 6x64 scores and 6 x headDim accumulators, no materialized L x L attention matrix</text>
</svg>
