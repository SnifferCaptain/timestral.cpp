<path d="M446,184 V196 H766 V184" fill="none" stroke="#4c8bf5" stroke-width="1.6"/>
<text x="606" y="216" text-anchor="middle" font-size="13" fill="#2b6cb0">Page table capacity 4: persistent pages cover shared history only</text>
<path d="M766,184 V196 H926 V184" fill="none" stroke="#e8a33d" stroke-width="1.6"/>
<text x="846" y="216" text-anchor="middle" font-size="13" fill="#b7791f">Tail not written to persistent pages</text>
<path d="M406,114 V90" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="406" y="82" text-anchor="middle" font-size="12" fill="#3e4c59">release + discard oldest page</text>
<path d="M726,90 V114" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="726" y="82" text-anchor="middle" font-size="12" fill="#3e4c59">appendPages appends</text>
<text x="50" y="260" text-anchor="start" font-size="14" fill="#1f2933">- positionOffset = begin / patch: retained pages keep original absolute positions, no renumbering of old KV</text>
<text x="50" y="290" text-anchor="start" font-size="14" fill="#1f2933">- scaleStates accumulate from stream start, evicting old pages does not roll back normalization stats</text>
<text x="50" y="320" text-anchor="start" font-size="14" fill="#1f2933">- Retained pages carry context from creation time, not recomputed after window slides, so not equivalent to full recompute within window</text>
<text x="50" y="350" text-anchor="start" font-size="14" fill="#1f2933">- predictFrozen reads these pages, only recomputes aux and predict tail; default public service does not use this path</text>
</svg>
