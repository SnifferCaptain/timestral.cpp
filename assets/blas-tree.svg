<line x1="767" y1="344" x2="767" y2="368" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="1021" y1="344" x2="1021" y2="368" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="20" y="514" text-anchor="start" font-size="15" fill="#444" font-weight="bold">Kernel layer</text>
<rect x="207.5" y="480" width="230" height="58" rx="6" fill="#efe8f6" stroke="#666" stroke-width="1.2"/>
<text x="322.5" y="505.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">6x16 FMA microkernel</text>
<text x="322.5" y="523.4" text-anchor="middle" font-size="14" fill="#222">12 accum + 2B + 1A</text>
<rect x="525" y="480" width="230" height="58" rx="6" fill="#efe8f6" stroke="#666" stroke-width="1.2"/>
<text x="640" y="505.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">1-5 row narrow kernels</text>
<text x="640" y="523.4" text-anchor="middle" font-size="14" fill="#222">Single chain preserves accumulation order</text>
<rect x="842.5" y="480" width="230" height="58" rx="6" fill="#efe8f6" stroke="#666" stroke-width="1.2"/>
<text x="957.5" y="505.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">2^x decomposition exp</text>
<text x="957.5" y="523.4" text-anchor="middle" font-size="14" fill="#222">Magic-number rounding and exponent bit assembly</text>
<path d="M620,428 V454 H322.5 M620,454 H957.5" fill="none" stroke="#999" stroke-width="1.2"/>
<line x1="322.5" y1="454" x2="322.5" y2="478" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="640" y1="454" x2="640" y2="478" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="957.5" y1="454" x2="957.5" y2="478" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="20" y="624" text-anchor="start" font-size="15" fill="#444" font-weight="bold">Instruction set layer</text>
<rect x="207.5" y="590" width="230" height="58" rx="6" fill="#e6f2f3" stroke="#666" stroke-width="1.2"/>
<text x="322.5" y="615.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">AVX2+FMA3 separate compile unit</text>
<text x="322.5" y="633.4" text-anchor="middle" font-size="14" fill="#222">Intrinsics and hand-written loops only</text>
<rect x="525" y="590" width="230" height="58" rx="6" fill="#e6f2f3" stroke="#666" stroke-width="1.2"/>
<text x="640" y="615.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CPUID+XGETBV runtime detection</text>
<text x="640" y="633.4" text-anchor="middle" font-size="14" fill="#222">Fall back to scalar when unmet</text>
<rect x="842.5" y="590" width="230" height="58" rx="6" fill="#e6f2f3" stroke="#666" stroke-width="1.2"/>
<text x="957.5" y="615.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Future: SSE4.2, NEON</text>
<text x="957.5" y="633.4" text-anchor="middle" font-size="14" fill="#222">Same packing contract</text>
