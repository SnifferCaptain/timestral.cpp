<line x1="259" y1="234" x2="259" y2="258" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="513" y1="234" x2="513" y2="258" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="767" y1="234" x2="767" y2="258" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="1021" y1="234" x2="1021" y2="258" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
