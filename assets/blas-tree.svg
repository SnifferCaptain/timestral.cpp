<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1180" height="700" fill="#fcfcfa"/>
<text x="590" y="30" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">Timestral Custom BLAS Backend Optimization Tree (Top-Down)</text>
<rect x="440" y="50" width="300" height="56" rx="6" fill="#e8eef7" stroke="#666" stroke-width="1.2"/>
<text x="590" y="74.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">End-to-end time for one prediction</text>
<text x="590" y="92.4" text-anchor="middle" font-size="14" fill="#222">Goal: reduce single-thread time without changing accuracy</text>
<text x="20" y="184" text-anchor="start" font-size="15" fill="#444" font-weight="bold">Request layer</text>
<rect x="207.5" y="150" width="230" height="58" rx="6" fill="#f3ede2" stroke="#666" stroke-width="1.2"/>
<text x="322.5" y="175.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Shared prefix broadcast by row%V</text>
<text x="322.5" y="193.4" text-anchor="middle" font-size="14" fill="#222">No per-request KV copy</text>
<rect x="525" y="150" width="230" height="58" rx="6" fill="#f3ede2" stroke="#666" stroke-width="1.2"/>
<text x="640" y="175.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Pure prefill cutoff</text>
<text x="640" y="193.4" text-anchor="middle" font-size="14" fill="#222">Return after last time-axis KV write</text>
<rect x="842.5" y="150" width="230" height="58" rx="6" fill="#f3ede2" stroke="#666" stroke-width="1.2"/>
<text x="957.5" y="175.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Scheduling unchanged</text>
<text x="957.5" y="193.4" text-anchor="middle" font-size="14" fill="#222">Reuses Service batching and paging</text>
<path d="M590,106 V128 H322.5 M590,128 H957.5" fill="none" stroke="#999" stroke-width="1.2"/>
<line x1="322.5" y1="128" x2="322.5" y2="148" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="640" y1="128" x2="640" y2="148" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="957.5" y1="128" x2="957.5" y2="148" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="20" y="294" text-anchor="start" font-size="15" fill="#444" font-weight="bold">Model execution layer</text>
<rect x="144" y="260" width="230" height="58" rx="6" fill="#e9f3e6" stroke="#666" stroke-width="1.2"/>
<text x="259" y="285.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">RMSNorm fused into A packing</text>
<text x="259" y="303.4" text-anchor="middle" font-size="14" fill="#222">Inverse RMS computed once per row</text>
<rect x="398" y="260" width="230" height="58" rx="6" fill="#e9f3e6" stroke="#666" stroke-width="1.2"/>
<text x="513" y="285.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">QKV+gate in one GEMM</text>
<text x="513" y="303.4" text-anchor="middle" font-size="14" fill="#222">Keeps 4D row width, no split</text>
<rect x="652" y="260" width="230" height="58" rx="6" fill="#e9f3e6" stroke="#666" stroke-width="1.2"/>
<text x="767" y="285.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">RoPE shares sin/cos</text>
<text x="767" y="303.4" text-anchor="middle" font-size="14" fill="#222">Trig computed once for Q and K</text>
<rect x="906" y="260" width="230" height="58" rx="6" fill="#e9f3e6" stroke="#666" stroke-width="1.2"/>
<text x="1021" y="285.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Residual beta=1 accumulate</text>
<text x="1021" y="303.4" text-anchor="middle" font-size="14" fill="#222">Gate in-place, SwiGLU compact output</text>
