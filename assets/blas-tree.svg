<text x="259" y="395.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">GEMM</text>
<text x="259" y="413.4" text-anchor="middle" font-size="14" fill="#222">Pre-packed weights and 5-level blocking</text>
<rect x="398" y="370" width="230" height="58" rx="6" fill="#f7e9ea" stroke="#666" stroke-width="1.2"/>
<text x="513" y="395.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Attention</text>
<text x="513" y="413.4" text-anchor="middle" font-size="14" fill="#222">6x64 online softmax</text>
<rect x="652" y="370" width="230" height="58" rx="6" fill="#f7e9ea" stroke="#666" stroke-width="1.2"/>
<text x="767" y="395.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Mask block classification</text>
<text x="767" y="413.4" text-anchor="middle" font-size="14" fill="#222">Empty skipped, Full no expand</text>
<rect x="906" y="370" width="230" height="58" rx="6" fill="#f7e9ea" stroke="#666" stroke-width="1.2"/>
<text x="1021" y="395.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Elementwise</text>
<text x="1021" y="413.4" text-anchor="middle" font-size="14" fill="#222">Vector exp, sigmoid, SwiGLU</text>
