<text x="364" y="76" text-anchor="middle" font-size="13" fill="#c05621">第j维与第j+32维成对旋转，j = 0…15</text>
<text x="460" y="240" text-anchor="middle" font-size="13" fill="#3e4c59">ropeDim = headDim × rope_partial_factor = 64 × 0.5 = 32，第j对的角度 = 位置 × 10000^(−2j/32)</text>
<text x="460" y="266" text-anchor="middle" font-size="13" fill="#3e4c59">只在time轴子层对Q、K施加，V与variate轴不旋转；发布权重的QKV先从(qkv, headDim, head)重排为(head, headDim)</text>
