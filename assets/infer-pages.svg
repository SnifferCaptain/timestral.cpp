<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="#fafbfc"/>
<text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold">Content-addressed paged prefix cache</text>
<circle cx="80" cy="200" r="24" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="80" y="205" text-anchor="middle" font-size="14" fill="#1f2933">root</text>
<rect x="140" y="178" width="120" height="44" rx="6" fill="#e6f6ec" stroke="#3fa66a" stroke-width="1.5"/>
<text x="200" y="204.9" text-anchor="middle" font-size="14">Page A  key1</text>
<rect x="300" y="178" width="120" height="44" rx="6" fill="#e6f6ec" stroke="#3fa66a" stroke-width="1.5"/>
<text x="360" y="204.9" text-anchor="middle" font-size="14">Page B  key2</text>
<rect x="460" y="128" width="120" height="44" rx="6" fill="#e8f1fd" stroke="#4c8bf5" stroke-width="1.5"/>
<text x="520" y="154.9" text-anchor="middle" font-size="14">Page C  key3</text>
<rect x="460" y="228" width="120" height="44" rx="6" fill="#fdf0e1" stroke="#e8a33d" stroke-width="1.5"/>
<text x="520" y="254.9" text-anchor="middle" font-size="14">Page D  key3′</text>
<path d="M104,200 H136" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M260,200 H296" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M420,192 L456,156" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M420,208 L456,244" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="60" y="316" text-anchor="start" font-size="14" fill="#1f2933">View from source s1: [A, B, C]</text>
<text x="60" y="342" text-anchor="start" font-size="14" fill="#1f2933">View from source s2: [A, B, D] (3rd patch differs in content)</text>
<text x="60" y="368" text-anchor="start" font-size="14" fill="#1f2933">A, B hit the same physical page by content, each referenced by two views</text>
<rect x="620" y="70" width="350" height="236" rx="6" fill="#ffffff" stroke="#4c8bf5" stroke-width="1.5"/>
<text x="632" y="102.9" text-anchor="start" font-size="14" font-weight="bold">One page = one patch x one group of V rows</text>
<text x="632" y="132.9" text-anchor="start" font-size="13">keys[8], values[8]: per time sublayer (V, 3, 64)</text>
<text x="632" y="162.9" text-anchor="start" font-size="13">maskBits: whether each row can be attended by later slots</text>
<text x="632" y="192.9" text-anchor="start" font-size="13">positions: RoPE position per row</text>
<text x="632" y="222.9" text-anchor="start" font-size="13">scaleStates: count, sum, m2 at patch end per row</text>
<text x="632" y="252.9" text-anchor="start" font-size="13">parentKey, key, inputFingerprint</text>
<text x="632" y="282.9" text-anchor="start" font-size="13">references, lastUse, occupied</text>
<rect x="40" y="400" width="930" height="62" rx="6" fill="#fdf0e1" stroke="#e8a33d" stroke-width="1.5"/>
<text x="505" y="425.9" text-anchor="middle" font-size="14" font-weight="bold">key(i) = FNV-1a(seed, key(i-1), obs bits, value bit pattern, mask bits, position, config fingerprint)</text>
<text x="505" y="445.9" text-anchor="middle" font-size="13">Lookup compares key, parentKey and inputFingerprint simultaneously; inputFingerprint uses a different seed</text>
<text x="500" y="500" text-anchor="middle" font-size="13" fill="#3e4c59">One page pool per channel count V, capacity Settings.cachePages, allocated on first use; when full only evicts LRU pages with zero refcount</text>
<text x="500" y="526" text-anchor="middle" font-size="13" fill="#3e4c59">When no evictable page, the request falls back to full recompute; abort(streamId) returns view refs and removes unreferenced page keys</text>
</svg>
